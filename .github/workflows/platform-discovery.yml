name: Platform job discovery

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/platform-discovery.yml
      - scripts/fetch_platform_jobs.py
      - scripts/requirements-platform.txt
  schedule:
    - cron: "5 10 * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: job-lobster-platform-discovery
  cancel-in-progress: false

jobs:
  collect-indeed:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the collector
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Set up Python
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-platform.txt

      - name: Install the pinned collector
        run: python -m pip install --disable-pip-version-check -r scripts/requirements-platform.txt

      - name: Search Indeed and ingest current jobs
        env:
          JOB_LOBSTER_INGEST_URL: https://job-lobster.awcarr97.workers.dev/api/v1/ingest/platform-jobs
          PYTHONUNBUFFERED: "1"
        run: python scripts/fetch_platform_jobs.py
